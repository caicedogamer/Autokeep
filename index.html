<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="AutoKeep — bookkeeping automatizado para PYMES, ejecutado completamente en tu navegador."
    />
    <title>AutoKeep</title>
    <!--
      Anti-flash theme bootstrap. Runs before the body paints so the
      correct [data-theme] is on <html> from the first frame. Mirrors the
      logic in src/core/theme/theme-service.ts; kept tiny and dependency-
      free per Constitution Principle VII.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('autokeep:theme');
          if (pref !== 'light' && pref !== 'dark') {
            pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', pref);
        } catch (_) {
          /* localStorage may be unavailable — skip. */
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    <div id="app"></div>
    <noscript>
      <p>
        AutoKeep requiere JavaScript para funcionar. Por favor, habilítalo en tu navegador y recarga
        la página.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
